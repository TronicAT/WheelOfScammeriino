<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyörä</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main class="game">
    <input id="name" class="name" type="text" placeholder="Kirjoita nimesi" maxlength="24" autocomplete="off">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <g id="wheel"></g>
        <circle r="7" fill="#111214" stroke="#2a2d31" stroke-width="2"/>
      </svg>
    </div>
    <button id="spin" class="spin">PYÖRÄYTÄ</button>
    <div id="result" class="result" role="status" aria-live="polite"></div>
  </main>

  <aside class="spinLog">
    <header><span>Historia</span><button id="clear" type="button">Tyhjennä</button></header>
    <ul id="log"></ul>
  </aside>
</div>

<script>
/* ---------- ASETUKSET ----------
   weight = todellinen todennäköisyys (prosenttia). Luvut skaalataan automaattisesti,
   joten summan ei tarvitse olla tasan 100.
   Pyörässä lohkot näytetään silti aina yhtä suurina (33,33 % kukin).
   REPEAT = montako kertaa vaihtoehtojen kierros toistuu pyörässä (2 → 6 lohkoa:
   SUORITA, EIH, RESPIN, SUORITA, EIH, RESPIN). Ei vaikuta todennäköisyyksiin. */
const REPEAT = 2;
let OPTIONS = [
  { id: "suorita", label: "SUORITA",  sub: "",             weight: 33.33, color: "#c0504d", message: n => `${n}, suorita!` },
  { id: "eih",     label: "EIH",      sub: "immuniteetti", weight: 33.33, color: "#4f9d69", message: n => `${n} sai immuniteetin!` },
  { id: "respin",  label: "RESPIN",   sub: "",             weight: 33.34, color: "#5b84c4", message: n => `${n}, respin!`, autoSpin: true },
];
const RESPIN_DELAY = 1.5;   // sekuntia ennen kuin RESPIN pyörähtää automaattisesti uudelleen
/* Nämä nimet saavat aina SUORITA (100 %). Kirjoita nimet tähän lainausmerkeissä,
   pilkulla erotettuna, esim. ["Matti", "Maija"]. Isoilla/pienillä kirjaimilla ei ole väliä. */
const ALWAYS_SUORITA = ["Aapo", "Ape", "AAPO", "APE"];
const SPIN_SECONDS = 4.6;   // pidä sama kuin CSS:n transition-kesto
const HISTORY_MAX = 50;
/* -------------------------------- */

const $ = id => document.getElementById(id);
const wheel = $("wheel"), nameEl = $("name"), spinBtn = $("spin"),
      resultEl = $("result"), logEl = $("log");
const N = OPTIONS.length;
const SLICES = N * REPEAT, SLICE = 360 / SLICES;   // lohkon i vaihtoehto on OPTIONS[i % N]

function rand() {
  return crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
}

const normName = s => s.trim().toLocaleLowerCase("fi");

function pickOption(name = "") {
  if (ALWAYS_SUORITA.some(n => normName(n) === normName(name))) {
    return OPTIONS.findIndex(o => o.id === "suorita");
  }
  const total = OPTIONS.reduce((s, o) => s + o.weight, 0);
  let r = rand() * total;
  for (let i = 0; i < N; i++) {
    r -= OPTIONS[i].weight;
    if (r < 0) return i;
  }
  return N - 1;
}

/* Pyörän piirto */
const pt = (deg, r) => {
  const a = (deg - 90) * Math.PI / 180;
  return [r * Math.cos(a), r * Math.sin(a)];
};
function drawWheel() {
  const R = 96;
  let html = "";
  for (let i = 0; i < SLICES; i++) {
    const o = OPTIONS[i % N];
    const [x1, y1] = pt(i * SLICE, R), [x2, y2] = pt((i + 1) * SLICE, R);
    html += `<path d="M0 0 L${x1} ${y1} A${R} ${R} 0 ${SLICE > 180 ? 1 : 0} 1 ${x2} ${y2} Z"
              fill="${o.color}" stroke="#111214" stroke-width="2"/>`;
    const mid = i * SLICE + SLICE / 2;
    let rot = mid - 90;
    if (((rot % 360) + 360) % 360 > 90 && ((rot % 360) + 360) % 360 < 270) rot += 180;
    const [tx, ty] = pt(mid, 60);
    html += `<g transform="translate(${tx} ${ty}) rotate(${rot})" fill="#fff" text-anchor="middle">
      <text y="${o.sub ? -1 : 4}" font-size="12" font-weight="700" letter-spacing=".5">${o.label}</text>
      ${o.sub ? `<text y="10" font-size="7" opacity=".85">${o.sub}</text>` : ""}
    </g>`;
  }
  wheel.innerHTML = html;
}

/* Pyöräytys */
let rotation = 0, spinning = false;

function spin(forcedName) {
  if (spinning) return;
  const name = (forcedName ?? nameEl.value).trim();
  if (!name) {
    nameEl.classList.remove("error"); void nameEl.offsetWidth; nameEl.classList.add("error");
    nameEl.focus();
    return;
  }
  spinning = true;
  spinBtn.disabled = true;
  resultEl.classList.remove("show");

  const idx = pickOption(name);                   // tulos arvotaan painojen mukaan
  const slice = idx + N * Math.floor(rand() * REPEAT);   // yksi vaihtoehdon lohkoista
  const offset = SLICE * (0.15 + 0.7 * rand());   // kohta lohkon sisällä, ei aivan reunalla
  const target = slice * SLICE + offset;          // kulma pyörän omassa koordinaatistossa
  const delta = (((-target - rotation) % 360) + 360) % 360;
  rotation += 360 * (5 + Math.floor(rand() * 3)) + delta;
  wheel.style.transform = `rotate(${rotation}deg)`;

  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    wheel.removeEventListener("transitionend", finish);
    showResult(name, OPTIONS[idx]);
    if (OPTIONS[idx].autoSpin) {   // nappi pysyy lukittuna ja sama nimi pyöräyttää uudelleen
      setTimeout(() => { spinning = false; spin(name); }, RESPIN_DELAY * 1000);
      return;
    }
    spinning = false;
    spinBtn.disabled = false;
  };
  wheel.addEventListener("transitionend", finish);
  setTimeout(finish, SPIN_SECONDS * 1000 + 300);
}

function showResult(name, o) {
  resultEl.textContent = o.message(name);
  resultEl.style.setProperty("--c", o.color);
  void resultEl.offsetWidth;
  resultEl.classList.add("show");
  spinLog.unshift({ name, id: o.id, t: Date.now() });
  spinLog.length = Math.min(spinLog.length, HISTORY_MAX);
  save();
  renderLog();
}

/* Historia */
let spinLog = [];
try { spinLog = JSON.parse(localStorage.getItem("rngspin_history") || "[]"); } catch (e) {}
function save() { try { localStorage.setItem("rngspin_history", JSON.stringify(spinLog)); } catch (e) {} }

function renderLog() {
  if (!spinLog.length) { logEl.innerHTML = '<li class="empty">Ei vielä pyöräytyksiä.</li>'; return; }
  logEl.innerHTML = "";
  spinLog.forEach(h => {
    const o = OPTIONS.find(x => x.id === h.id);
    if (!o) return;
    const li = document.createElement("li");
    const time = new Date(h.t).toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" });
    li.innerHTML = `<span class="dot" style="background:${o.color}"></span>
      <span class="who"></span><span class="what">${o.label.toLowerCase()} · ${time}</span>`;
    li.querySelector(".who").textContent = h.name;   // nimi tekstinä, ei HTML:nä
    logEl.appendChild(li);
  });
}

$("clear").addEventListener("click", () => { spinLog = []; save(); renderLog(); });
spinBtn.addEventListener("click", () => spin());
nameEl.addEventListener("keydown", e => { if (e.key === "Enter") spin(); });
nameEl.addEventListener("animationend", () => nameEl.classList.remove("error"));

drawWheel();
renderLog();
</script>
</body>
</html>
